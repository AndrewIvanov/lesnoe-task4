<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Лесное — бронирование домов</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="#">✳ ЛЕСНОЕ</a><a href="#bookings">Мои брони <span id="count">0</span></a></div></header><main class="wrap"><section class="hero"><p class="eyebrow">ОТДЫХ НА ПРИРОДЕ</p><h1>Ваш дом<br>в тишине леса.</h1><p>Выберите уютный дом у озера и спланируйте отдых.</p></section><section class="filters" aria-label="Фильтры">
<label>Количество гостей<span class="select-control"><select id="filterGuests" name="filterGuests" autocomplete="off"><option value="1">Любое</option><option value="2">2 и более</option><option value="4">4 и более</option><option value="6">6 и более</option><option value="8">8 и более</option></select></span></label>
<label>Цена за ночь, ₽<span class="select-control"><select id="filterPrice" name="filterPrice" autocomplete="off"><option value="Infinity">Любая</option><option value="5000">До 5 000</option><option value="7000">До 7 000</option><option value="9000">До 9 000</option></select></span></label>
<button class="secondary" id="resetFilters">Сбросить фильтры</button></section><p id="notice" role="status" aria-live="polite"></p><div class="section-title"><h2>Выберите дом</h2><span id="results"></span></div><div class="layout"><section class="panel"><div class="maphead"><strong>Схема посёлка</strong><span>↑ Север</span></div><div class="map" id="map" aria-label="Схема посёлка"><div class="lake">ОЗЕРО</div><div class="road"></div><div class="trees" aria-hidden="true">♠ ♠ ♠ ♠ ♠</div><div id="markers"></div></div><div class="legend"><span>○ Свободен</span><span>✓ Выбран</span><span>× Занят</span></div></section><section class="panel detail" id="detail" aria-labelledby="detailTitle"><p class="eyebrow">ВАШ ОТДЫХ</p><h2 id="detailTitle">Выберите дом</h2><p id="description">Нажмите на свободный дом на схеме или в списке.</p><p id="rate"></p>
<form id="bookingForm" novalidate hidden>
<label>Гостей<input id="guests" name="guests" autocomplete="off" type="number" min="1" step="1" value="1" required aria-describedby="guestError"><small class="error" id="guestError"></small></label>
<label>Ночей<input id="nights" name="nights" autocomplete="off" type="number" min="1" max="30" step="1" value="1" required aria-describedby="nightError"><small class="error" id="nightError"></small></label>
<div class="total"><span>Итого</span><strong id="total" aria-live="polite">—</strong></div><p class="error" id="formError" role="alert"></p>
<button class="primary" id="bookingSubmit" type="submit">Подтвердить бронь</button>
</form>
</section></div><section><div class="section-title"><h2>Все дома</h2></div><div id="list" class="houses"></div></section><section id="bookings"><div class="section-title"><h2>Мои брони</h2><button id="resetDemo" class="secondary">Сбросить демо</button></div><div id="bookingList"></div></section></main><script type="module" src="app.js"></script></body></html>
